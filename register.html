<style>
    body {
        background: #f6f3ff;
        font-family: Arial, sans-serif;
    }

    .register-container {
        max-width: 430px;
        margin: 45px auto;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 5px 25px #00000012;
    }

    .register-container h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .register-description {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .register-container label {
        display: block;
        margin: 15px 0 7px;
        font-weight: bold;
    }

    .register-container input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
    }

    .register-btn {
        width: 100%;
        padding: 13px;
        margin-top: 22px;
        background: #6c4ce4;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    .register-btn:hover {
        background: #5738c9;
    }

    .register-message {
        text-align: center;
        margin-top: 15px;
    }

    .register-links {
        text-align: center;
        margin-top: 20px;
    }

    .register-links a,
    .back-home {
        color: #6c4ce4;
    }

    .back-home {
        display: block;
        text-align: center;
        margin-top: 20px;
    }
</style>
```

</head>

<body>

```
<header>
    <nav>
        <a href="index.html">📚 Book Bazaar</a>
        <a href="index.html">Home</a>
        <a href="index.html#books">Books</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="register-container">
    <h1>Create an Account 📚</h1>
    <p class="register-description">
        Join Book Bazaar and discover your next favourite book.
    </p>

    <form id="registerForm">
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
            minlength="2"
            maxlength="60"
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Create Password</label>
        <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter your password again"
            minlength="6"
            required
        >

        <button type="submit" class="register-btn">
            Create Account
        </button>
    </form>

    <p id="registerMessage" class="register-message"></p>

    <div class="register-links">
        Already have an account?
        <a href="login.html">Login here</a>
    </div>

    <a class="back-home" href="index.html">← Back to Home</a>
</main>

<script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const message = document.getElementById("registerMessage");

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match. Please try again.";
            return;
        }

        let users = [];

        try {
            users = JSON.parse(localStorage.getItem("bb_users") || "[]");

            if (!Array.isArray(users)) {
                users = [];
            }
        } catch {
            users = [];
        }

        const existingUser = users.find(function(user) {
            return user.email.toLowerCase() === email;
        });

        if (existingUser) {
            message.style.color = "red";
            message.textContent = "This email is already registered. Please log in.";
            return;
        }

        users.push({
            name: name,
            email: email,
            password: password
        });

        localStorage.setItem("bb_users", JSON.stringify(users));

        message.style.color = "green";
        message.textContent = "Registration successful! Redirecting to login...";

        document.getElementById("registerForm").reset();

        setTimeout(function() {
            window.location.href = "login.html";
        }, 1500);
    });
</script>
```

</body>
</html>
